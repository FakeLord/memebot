appId: com.fakelord.memebot
productName: MemeBot
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
  - '!**/*.map'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: MemeBot-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# Güncellemeler GitHub Releases'ten gelir (electron-updater bu ayarı okur)
publish:
  provider: github
  owner: FakeLord
  repo: memebot
  releaseType: draft   # CI önce taslak açar, yükleme bitince yayına alır
