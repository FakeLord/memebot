name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Birim testleri (entegrasyon testleri yerel Supabase ister; CI'da kendiliğinden atlanır)
      - run: npm test
      - run: npm run build:web
