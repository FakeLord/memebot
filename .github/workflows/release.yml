# Yeni sürüm yayınlama:
#   1) package.json içindeki "version" alanını artırın (ör. 0.1.0 → 0.1.1)
#   2) git commit -am "v0.1.1" && git tag v0.1.1 && git push --follow-tags
# Bu iş Windows kurulum dosyasını derler ve GitHub Releases'e yükler.
# Kurulu uygulamalar açılışta ve 30 dakikada bir yeni sürümü kendisi indirir.
#
# Gerekli repo ayarları (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL       (Variables)
#   VITE_SUPABASE_ANON_KEY  (Variables — anon anahtar zaten uygulamaya gömülür)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Etiket ile package.json sürümü aynı mı?
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Etiket ${GITHUB_REF_NAME} ama package.json $PKG" && exit 1
          fi

      # Release'i önceden aç: electron-builder dosyaları paralel yüklerken
      # iki ayrı release oluşturmasın (v0.1.0'da yaşandı).
      - name: Release'i oluştur
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "MemeBot $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Derle ve yayınla
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # Taslak sadece tüm dosyalar yüklendikten sonra yayına alınır;
      # böylece kurulu uygulamalar yarım bir sürümü görmez.
      - name: Taslağı yayınla
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
