const conf = (n, cls = '') => `<span class="conf ${cls}">${Array.from({ length: 20 }, (_, i) => `<i class="${i < n ? 'f' : ''}"></i>`).join('')}</span>`
const addr = (a) => `<span class="addr">${a.match(/.{1,4}/g).map((g, i, arr) => (i < 2 || i >= arr.length - 2 ? `<b>${g}</b>` : g)).join(' ')}</span>`
const short = (a) => `<span class="addr"><b>${a.slice(0, 4)}</b> ${a.slice(4, 8)} · · · ${a.slice(-8, -4)} <b>${a.slice(-4)}</b></span>`
const trace = (steps, nowIx) =>
  `<div class="trace">${['SİNYAL', 'GÜVENLİK', 'KURAL', 'ONAY', 'EMİR']
    .map((k, i) => `<div class="${i < nowIx ? 'done' : i === nowIx ? 'now' : ''}"><span class="k">${String(i + 1).padStart(2, '0')} ${k}</span><span class="v">${steps[i] ?? '—'}</span></div>`)
    .join('')}</div>`
const spark = (pts, cls) => {
  const w = 96, h = 24, max = Math.max(...pts), min = Math.min(...pts)
  const xy = pts.map((p, i) => [(i / (pts.length - 1)) * (w - 4) + 2, h - 3 - ((p - min) / (max - min || 1)) * (h - 6)])
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')
  const last = xy[xy.length - 1]
  const col = cls === 'neg' ? '#F26D6D' : '#57D9A3'
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="#555A62" stroke-width="1"/><rect x="${last[0] - 2}" y="${last[1] - 2}" width="4" height="4" fill="${col}"/></svg>`
}
const toks = (s) =>
  s
    .split(' ')
    .map((w) => {
      const m = w.match(/^\[(\d)\](.*)$/)
      if (w.startsWith('{ca}')) return `<span class="ca">${w.slice(4)}</span>`
      return m ? `<span class="w${m[1]}">${m[2]}</span>` : `<span>${w}</span>`
    })
    .join('')

function shell(active, title, body, opts = {}) {
  let ix = 0
  const nav = NAV.map(([k, label, count]) => {
    if (k === '---') return `<div class="nav-sep">${label}</div>`
    ix++
    const on = active === k || (active.startsWith('ayarlar') && k === 'ayarlar')
    return `<a class="${on ? 'on' : ''}" href="#${k}"><span class="ix">${String(ix).padStart(2, '0')}</span><span>${label}</span>${count ? `<span class="count">${count}</span>` : ''}</a>`
  }).join('')
  return `
  <div class="app">
    <aside class="rail">
      <div class="brand">memebot<span class="caret"></span></div>
      <nav class="nav">${nav}</nav>
      <div class="rail-foot">
        <span class="who">civan</span>
        <span class="faint mono" style="font-size:11px">FOUNDER · ÇIKIŞ</span>
      </div>
    </aside>
    <header class="top">
      <h1>${title}</h1>
      <div class="cmd"><span class="prompt">&gt;</span><span>Adres, @hesap ya da komut yazın</span><span class="kbd">CTRL K</span></div>
      <div class="right-side">
        ${opts.topRight ?? `<span class="tag">DENEME</span><span class="row mute" style="font-size:12px"><span class="pip pos"></span>Motor</span><button class="btn sm danger">Tümünü durdur</button>`}
      </div>
    </header>
    <main class="main ${opts.panel ? 'with-panel' : ''}">${body}</main>
    <footer class="status">
      <span class="row"><span class="pip pos"></span>Bağlı</span>
      <span class="row"><span class="pip pos"></span>Motor · vps-fra1</span>
      <span>GMGN 84 ms</span>
      <span>Deneme modu</span>
      <span>Ücret <b style="color:var(--ink)">P1</b> P2 P3</span>
      <span class="row"><span class="thinking"><i></i><i></i><i></i></span><span class="ai">2 token değerlendiriliyor</span></span>
      <span class="push">Web · v0.2.0</span>
    </footer>
  </div>`
}

      <div style="display:grid;gap:2px">

        <span class="mono faint" style="font-size:11px">${time} · alındı +${lat}</span>
      </div>
      <div class="row" style="margin-left:auto">
        ${isNew ? '<span class="tag ai">YENİ</span>' : ''}
        <button class="btn xs">Gizle</button>
        <button class="btn sm primary">Deploy</button>

    </div>
    <div class="post-body">

    ${sugg ? `<div class="sugg">${sugg.map(([n, t, mc, c]) => `<div><div class="mono-logo">${t.slice(0, 2)}</div><div style="display:grid;gap:3px"><span class="t">${n}</span><span class="s">$${t} · MC ${mc}</span></div><div class="row"><span class="score ${c > 14 ? 'pos' : c > 9 ? 'warn' : 'neg'}">${(c / 20).toFixed(2)}</span><button class="btn xs">Satın al</button></div></div>`).join('')}</div>` : ''}

  </article>`
}

// ---------------------------------------------------------------- latent alan
function latent() {
  const c = document.getElementById('latent')
  const ctx = c.getContext('2d')
  const dpr = window.devicePixelRatio || 1
  const draw = (t) => {
    c.width = innerWidth * dpr
    c.height = innerHeight * dpr
    ctx.scale(dpr, dpr)
    const wave = (t / 30) % (innerHeight + 200)
    for (let y = 8; y < innerHeight; y += 16) {
      for (let x = 8; x < innerWidth; x += 16) {
        const d = Math.abs(y - (innerHeight * 0.32))
        const glow = Math.max(0, 1 - d / 40) * (0.5 + 0.5 * Math.sin(x / 90))
        ctx.fillStyle = glow > 0.05 ? `rgba(182,166,255,${0.08 + glow * 0.35})` : 'rgba(42,46,51,0.55)'
        ctx.fillRect(x, y, 1.2, 1.2)
      }
    }
  }
  draw(0)
}

function render() {
  const key = (location.hash || '#akis').slice(1)
  document.getElementById('root').innerHTML = (PAGES[key] || PAGES.akis)()
  latent()
}
addEventListener('hashchange', render)
